<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Sender</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Yerel: cdn.rawgit.com 2019'da kapatıldığı için QR kodu hiç çizilmiyordu -->
  <script src="qrcode.min.js"></script>
  <style>
    :root {
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }
    .button-spring {
      transition: transform 0.4s var(--ease-out), background-color 0.2s;
    }
    .button-spring:active {
      transform: scale(0.95);
    }
    .fade-enter {
      animation: fadeIn 0.4s var(--ease-out) forwards;
      opacity: 0;
      transform: translateY(4px);
    }
    @keyframes fadeIn {
      to { opacity: 1; transform: translateY(0); }
    }
    /* Hide scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background-color: #e5e7eb; border-radius: 10px; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-gray-800 bg-gray-50">

  <!-- Header -->
  <header class="h-16 border-b bg-white flex items-center justify-between px-6 shrink-0 shadow-sm z-10">
    <div class="flex items-center gap-4">
      <h1 class="text-xl font-bold">Ana Kişiler</h1>
      <button id="waConnectBtn" class="text-xs bg-green-50 text-green-700 px-3 py-1.5 rounded-lg border border-green-200 hover:bg-green-100 button-spring font-medium">
        WhatsApp Bağla
      </button>
    </div>
    <div class="flex gap-2">
      <button id="importBtn" class="button-spring bg-gray-100 text-gray-700 px-4 py-2 rounded-lg text-sm hover:bg-gray-200 font-medium">
        İçe Aktar (.vcf / .csv)
      </button>
      <button id="addContactBtn" class="button-spring bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700 font-medium">
        + Kişi Ekle
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex overflow-hidden">

    <!-- Contacts List -->
    <div class="flex-1 flex flex-col p-6 overflow-hidden">
      <div class="bg-white rounded-xl shadow-sm border flex flex-col flex-1 overflow-hidden">

        <!-- Search Bar -->
        <div class="px-4 py-3 border-b border-gray-100 flex items-center gap-2">
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input type="text" id="searchInput" class="flex-1 outline-none text-sm text-gray-700 placeholder-gray-400 bg-transparent" placeholder="İsim veya numaraya göre ara..." />
        </div>
        <!-- Table Header -->
        <div class="flex items-center px-4 py-3 border-b bg-gray-50 text-xs font-semibold text-gray-500 uppercase tracking-wider">
          <div class="w-10">
            <input type="checkbox" id="selectAllCheckbox" class="rounded border-gray-300 w-4 h-4 text-blue-600 focus:ring-blue-500 cursor-pointer" />
          </div>
          <div class="w-1/3">İsim</div>
          <div class="w-1/3">Telefon</div>
          <div class="flex-1 text-right">İşlem</div>
        </div>

        <!-- Table Body -->
        <div id="contactList" class="flex-1 overflow-y-auto divide-y">
          <!-- Rows injected here -->
        </div>
      </div>
    </div>

    <!-- Message Composer Sidebar -->
    <aside class="w-96 bg-white border-l flex flex-col shadow-lg z-20">
      <div class="p-6 flex flex-col h-full">
        <h2 class="text-lg font-bold mb-4">Toplu Mesaj Gönder</h2>

        <div class="flex items-center justify-between mb-2">
          <div class="text-sm text-gray-500">Seçili Kişi Sayısı: <span id="selectedCount" class="font-bold text-blue-600">0</span></div>
          <button id="saveGroupBtn" class="text-xs text-blue-600 hover:text-blue-800 bg-blue-50 px-2 py-1 rounded transition-colors hidden">Grup Olarak Kaydet</button>
        </div>

        <div class="mb-4 flex items-center gap-2">
          <select id="groupSelect" class="flex-1 border rounded p-2 text-sm text-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white hidden">
            <option value="">-- Kayıtlı Grup Seç (Hızlı Seçim) --</option>
          </select>
          <button id="deleteGroupBtn" class="text-red-500 hover:bg-red-50 p-2 rounded transition-colors hidden" title="Seçili Grubu Sil">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          </button>
        </div>
        <textarea id="messageBox" class="w-full border rounded-lg p-3 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-blue-500 flex-1 mb-4" placeholder="Mesajınızı yazın... İsimle hitap etmek için /isim yazabilirsiniz. Örn: Merhaba /isim, nasılsın?"></textarea>

        <div class="mb-4">
          <button id="attachImageBtn" class="w-full bg-gray-50 border border-dashed border-gray-300 text-gray-600 py-3 rounded-lg text-sm hover:bg-gray-100 transition-colors flex items-center justify-center gap-2">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <span id="imageName">Resim Ekle (İsteğe Bağlı)</span>
          </button>
          <button id="clearImageBtn" class="w-full text-xs text-red-500 hover:text-red-700 mt-1 hidden">Eklentiyi kaldır</button>
        </div>

        <button id="sendBtn" class="button-spring w-full bg-green-600 text-white font-medium py-3 rounded-lg shadow-sm hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed">
          Seçili Kişilere Gönder
        </button>

        <label class="flex items-start gap-2 mt-3 text-xs text-gray-600 select-none cursor-pointer">
          <input type="checkbox" id="validateCheck" class="mt-0.5 rounded border-gray-300 w-4 h-4 text-blue-600 focus:ring-blue-500 cursor-pointer" checked />
          <span>Göndermeden önce numaraları doğrula<br><span class="text-gray-400">WhatsApp'ta kayıtlı olmayanlar atlanır (önerilir)</span></span>
        </label>

        <button id="stopBtn" class="button-spring w-full mt-2 bg-red-50 text-red-600 border border-red-200 font-medium py-2 rounded-lg hover:bg-red-100 hidden">
          Durdur
        </button>

        <button id="retryBtn" class="button-spring w-full mt-2 bg-amber-50 text-amber-700 border border-amber-200 font-medium py-2 rounded-lg hover:bg-amber-100 hidden">
          Kalanları gönder
        </button>

        <div id="progressWrap" class="mt-4 hidden">
          <div class="h-1.5 bg-gray-100 rounded-full overflow-hidden">
            <div id="progressBar" class="h-full bg-green-500 transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>

        <div id="sendStatus" class="mt-4 text-center text-sm font-medium text-gray-500 hidden"></div>
      </div>
    </aside>

  </main>

  <!-- Modals -->
  <!-- QR Modal -->
  <div id="qrModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white p-6 rounded-xl shadow-lg flex flex-col items-center">
      <h3 class="text-lg font-bold mb-2">WhatsApp Web ile Tara</h3>
      <p class="text-sm text-gray-500 mb-4" id="qrStatus">QR kod oluşturuluyor...</p>
      <div id="qrcode" class="p-4 bg-white border rounded min-w-[256px] min-h-[256px]"></div>
      <button id="closeQrBtn" class="mt-4 text-sm text-gray-500 hover:text-gray-800">İptal</button>
    </div>
  </div>

  <!-- Contact Prompt Modal -->
  <div id="contactPromptModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white p-6 rounded-xl shadow-lg w-80">
      <h3 class="text-lg font-bold mb-4">Kişi Ekle</h3>
      <input type="text" id="contactNameInput" class="w-full border p-2 rounded mb-2 text-sm" placeholder="İsim (Örn: Ahmet Yılmaz)" />
      <input type="text" id="contactPhoneInput" class="w-full border p-2 rounded mb-2 text-sm" placeholder="Telefon (Örn: 0555 123 45 67)" />
      <p class="text-xs text-gray-400 mb-4">Numara hangi biçimde yazılırsa yazılsın (0..., +90..., boşluklu) otomatik düzeltilir.</p>
      <div class="flex justify-end gap-2">
        <button id="cancelContactBtn" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded text-sm font-medium">İptal</button>
        <button id="saveContactBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm font-medium">Kaydet</button>
      </div>
    </div>
  </div>

  <!-- Group Prompt Modal -->
  <div id="groupPromptModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white p-6 rounded-xl shadow-lg w-80">
      <h3 class="text-lg font-bold mb-4">Grup Olarak Kaydet</h3>
      <input type="text" id="groupNameInput" class="w-full border p-2 rounded mb-4 text-sm" placeholder="Grup Adı (Örn: Müşteriler)" />
      <div class="flex justify-end gap-2">
        <button id="cancelGroupBtn" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded text-sm font-medium">İptal</button>
        <button id="saveGroupConfirmBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm font-medium">Kaydet</button>
      </div>
    </div>
  </div>

  <script>
    const { invoke } = window.__TAURI__.tauri;
    const { open } = window.__TAURI__.dialog;
    const { listen } = window.__TAURI__.event;

    let contacts = [];
    let groups = [];
    let selectedContactIds = new Set();
    let attachedImagePath = null;
    let sending = false;
    let lastFailed = [];

    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v).replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));

    function setProgress(done, total) {
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;
      $('progressBar').style.width = pct + '%';
    }

    async function loadData() {
      try {
        contacts = await invoke('get_contacts');
        // Silinmiş kişiler seçimde kalmasın
        const ids = new Set(contacts.map(c => c.id));
        selectedContactIds = new Set([...selectedContactIds].filter(id => ids.has(id)));
        renderContacts();
        await loadGroups();
      } catch (e) {
        console.error("Veri yükleme hatası:", e);
      }
    }

    async function loadGroups() {
      try {
        groups = await invoke('get_groups');
        const select = $('groupSelect');
        if (groups.length > 0) {
          select.classList.remove('hidden');
          select.innerHTML = '<option value="">-- Kayıtlı Grup Seç (Hızlı Seçim) --</option>' +
            groups.map(g => `<option value="${esc(g.name)}">${esc(g.name)} (${g.contact_ids.length} Kişi)</option>`).join('');
        } else {
          select.classList.add('hidden');
        }
      } catch (e) {
        console.error("Grup yükleme hatası:", e);
      }
    }

    function updateSelectedCount() {
      $('selectedCount').textContent = selectedContactIds.size;
      $('saveGroupBtn').classList.toggle('hidden', selectedContactIds.size === 0);
    }

    function visibleContacts() {
      const query = $('searchInput').value.toLowerCase().trim();
      if (!query) return contacts;
      return contacts.filter(c =>
        c.name.toLowerCase().includes(query) || c.phone.toLowerCase().includes(query));
    }

    function renderContacts() {
      const container = $('contactList');
      const filtered = visibleContacts();

      if (filtered.length === 0) {
        container.innerHTML = contacts.length === 0
          ? '<div class="text-center text-gray-400 mt-10 text-sm">Listeniz boş. Lütfen sağ üstten kişileri içe aktarın.</div>'
          : '<div class="text-center text-gray-400 mt-10 text-sm">Arama sonucu bulunamadı.</div>';
        updateSelectedCount();
        return;
      }

      container.innerHTML = filtered.map((c, i) => `
        <div class="flex items-center px-4 py-3 hover:bg-gray-50 fade-enter" style="animation-delay: ${Math.min(i * 10, 300)}ms">
          <div class="w-10">
            <input type="checkbox" value="${c.id}" class="contact-checkbox rounded border-gray-300 w-4 h-4 text-blue-600 focus:ring-blue-500 cursor-pointer" ${selectedContactIds.has(c.id) ? 'checked' : ''} />
          </div>
          <div class="w-1/3 font-medium text-sm truncate">${esc(c.name)}</div>
          <div class="w-1/3 text-gray-500 text-sm">${esc(c.phone)}</div>
          <div class="flex-1 text-right">
            <button data-phone="${esc(c.phone)}" class="remove-btn text-red-500 hover:text-red-700 text-xs font-medium bg-red-50 hover:bg-red-100 px-2 py-1 rounded transition-colors button-spring">Sil</button>
          </div>
        </div>
      `).join('');

      const boxes = container.querySelectorAll('.contact-checkbox');
      boxes.forEach(cb => {
        cb.onchange = (e) => {
          const id = parseInt(e.target.value);
          if (e.target.checked) selectedContactIds.add(id);
          else selectedContactIds.delete(id);
          updateSelectedCount();
        };
      });
      updateSelectedCount();
    }

    $('contactList').addEventListener('click', async (e) => {
      const btn = e.target.closest('.remove-btn');
      if (!btn) return;
      await invoke('remove_contact', { phone: btn.dataset.phone });
      await loadData();
    });

    $('searchInput').oninput = renderContacts;

    $('selectAllCheckbox').onchange = (e) => {
      const filtered = visibleContacts();
      if (e.target.checked) filtered.forEach(c => selectedContactIds.add(c.id));
      else filtered.forEach(c => selectedContactIds.delete(c.id));
      renderContacts();
    };

    $('groupSelect').onchange = (e) => {
      const groupName = e.target.value;
      const deleteBtn = $('deleteGroupBtn');
      selectedContactIds.clear();
      if (groupName) {
        deleteBtn.classList.remove('hidden');
        const group = groups.find(g => g.name === groupName);
        if (group) {
          const ids = new Set(contacts.map(c => c.id));
          group.contact_ids.filter(id => ids.has(id)).forEach(id => selectedContactIds.add(id));
        }
      } else {
        deleteBtn.classList.add('hidden');
      }
      renderContacts();
    };

    $('deleteGroupBtn').onclick = async () => {
      const groupName = $('groupSelect').value;
      if (!groupName) return;
      if (confirm(`"${groupName}" grubunu silmek istediğinize emin misiniz? (Kişiler silinmez, sadece grup silinir)`)) {
        try {
          await invoke('delete_group', { name: groupName });
          await loadGroups();
          $('groupSelect').value = '';
          $('deleteGroupBtn').classList.add('hidden');
          selectedContactIds.clear();
          renderContacts();
        } catch (e) {
          alert("Grup silinemedi: " + e);
        }
      }
    };

    $('saveGroupBtn').onclick = () => {
      if (selectedContactIds.size === 0) return;
      $('groupPromptModal').classList.replace('hidden', 'flex');
      $('groupNameInput').focus();
    };

    $('cancelGroupBtn').onclick = () => {
      $('groupPromptModal').classList.replace('flex', 'hidden');
    };

    $('saveGroupConfirmBtn').onclick = async () => {
      const name = $('groupNameInput').value.trim();
      if (!name) return;
      try {
        await invoke('save_group', { name, contactIds: Array.from(selectedContactIds) });
        await loadGroups();
        $('groupSelect').value = name;
        $('groupPromptModal').classList.replace('flex', 'hidden');
        $('groupNameInput').value = '';
      } catch (e) {
        alert("Grup kaydedilemedi: " + e);
      }
    };

    // Import
    $('importBtn').onclick = async () => {
      const btn = $('importBtn');
      try {
        const filePath = await open({
          multiple: false,
          filters: [{ name: 'Contacts', extensions: ['vcf', 'csv', 'txt'] }]
        });
        if (!filePath) return;
        const oldText = btn.textContent;
        btn.textContent = 'İçe Aktarılıyor...';
        btn.disabled = true;
        try {
          const res = await invoke('import_contacts_from_file', { path: filePath });
          let msg = `${res.added} kişi eklendi.`;
          if (res.duplicates > 0) msg += `\n${res.duplicates} kişi zaten kayıtlıydı, atlandı.`;
          alert(msg);
          await loadData();
        } finally {
          btn.textContent = oldText;
          btn.disabled = false;
        }
      } catch (err) {
        alert("Dosya okuma hatası: " + err);
      }
    };

    // Manual Add
    $('addContactBtn').onclick = () => {
      $('contactPromptModal').classList.replace('hidden', 'flex');
      $('contactNameInput').focus();
    };

    $('cancelContactBtn').onclick = () => {
      $('contactPromptModal').classList.replace('flex', 'hidden');
    };

    $('saveContactBtn').onclick = async () => {
      const name = $('contactNameInput').value.trim();
      const phone = $('contactPhoneInput').value.trim();
      if (!phone) return alert("Lütfen en azından bir telefon numarası girin.");
      try {
        await invoke('add_contact', { name, phone });
        $('contactPromptModal').classList.replace('flex', 'hidden');
        $('contactNameInput').value = '';
        $('contactPhoneInput').value = '';
        await loadData();
      } catch (e) {
        alert("Kişi eklenemedi: " + e);
      }
    };

    // Attach Image
    $('attachImageBtn').onclick = async () => {
      try {
        const filePath = await open({
          multiple: false,
          filters: [{ name: 'Images', extensions: ['png', 'jpg', 'jpeg', 'webp'] }]
        });
        if (filePath) {
          attachedImagePath = filePath;
          const fileName = filePath.split('/').pop().split('\\').pop();
          $('imageName').textContent = fileName;
          $('imageName').classList.add('text-blue-600', 'font-medium');
          $('clearImageBtn').classList.remove('hidden');
        }
      } catch (e) { console.error(e); }
    };

    $('clearImageBtn').onclick = () => {
      attachedImagePath = null;
      $('imageName').textContent = 'Resim Ekle (İsteğe Bağlı)';
      $('imageName').classList.remove('text-blue-600', 'font-medium');
      $('clearImageBtn').classList.add('hidden');
    };

    // Send Message
    async function runSend(list) {
      if (sending) return;
      if (!list || list.length === 0) return alert("Lütfen tablodan en az 1 kişi seçin!");
      const msg = $('messageBox').value.trim();
      if (!msg && !attachedImagePath) return alert("Lütfen bir mesaj yazın veya resim ekleyin.");

      const btn = $('sendBtn');
      const status = $('sendStatus');

      sending = true;
      btn.disabled = true;
      $('retryBtn').classList.add('hidden');
      $('stopBtn').classList.remove('hidden');
      $('progressWrap').classList.remove('hidden');
      status.classList.remove('hidden');
      status.textContent = 'Başlatılıyor...';
      setProgress(0, list.length);

      try {
        const res = await invoke('send_whatsapp_messages', {
          contacts: list,
          message: msg,
          imagePath: attachedImagePath,
          validate: $('validateCheck').checked
        });
        setProgress(list.length, list.length);

        let text = `${res.sent} kişiye gönderildi.`;
        if (res.failed > 0) text += ` ${res.failed} kişiye gönderilemedi.`;
        if (res.skipped > 0) text += ` ${res.skipped} numara WhatsApp'ta kayıtlı olmadığı için atlandı.`;
        status.textContent = text;

        lastFailed = res.pending || [];
        $('retryBtn').classList.toggle('hidden', lastFailed.length === 0);
        $('retryBtn').textContent = `Kalanları gönder (${lastFailed.length})`;
        alert("İşlem bitti: " + text + (lastFailed.length ? `\n${lastFailed.length} kişi kaldı, 'Kalanları gönder' ile devam edebilirsiniz.` : ''));
      } catch (err) {
        alert("Hata: " + err);
        status.textContent = String(err);
      } finally {
        sending = false;
        btn.disabled = false;
        $('stopBtn').classList.add('hidden');
      }
    }

    $('sendBtn').onclick = () => {
      runSend(contacts.filter(c => selectedContactIds.has(c.id)));
    };

    $('retryBtn').onclick = () => {
      runSend(lastFailed);
    };

    $('stopBtn').onclick = () => {
      invoke('stop_sending').catch(() => {});
      $('stopBtn').classList.add('hidden');
    };

    // Listeners
    listen('send_status', (event) => {
      const text = event.payload;
      const status = $('sendStatus');
      status.classList.remove('hidden');
      status.textContent = text;
      const m = /\((\d+)\/(\d+)\)/.exec(text);
      if (m) setProgress(parseInt(m[1], 10) - 1, parseInt(m[2], 10));
    });

    function applyStatus(st) {
      const btn = $('waConnectBtn');
      if (st === 'connected') {
        btn.textContent = 'Bağlı (Hazır)';
        btn.disabled = true;
        btn.classList.remove('bg-green-50', 'text-green-700', 'border-green-200');
        btn.classList.add('bg-gray-100', 'text-gray-500', 'border-gray-200');
      } else if (st === 'connecting') {
        btn.textContent = 'Bağlanıyor...';
        btn.disabled = true;
      } else {
        btn.textContent = 'WhatsApp Bağla';
        btn.disabled = false;
        btn.classList.add('bg-green-50', 'text-green-700', 'border-green-200');
        btn.classList.remove('bg-gray-100', 'text-gray-500', 'border-gray-200');
      }
    }

    $('waConnectBtn').onclick = async () => {
      $('qrModal').classList.replace('hidden', 'flex');
      $('qrStatus').textContent = 'QR kod bekleniyor... (Birkaç saniye sürebilir)';
      $('qrcode').innerHTML = '';
      try {
        await invoke('connect_whatsapp');
      } catch (err) {
        $('qrStatus').textContent = 'Bağlantı hatası: ' + err;
      }
    };

    $('closeQrBtn').onclick = () => {
      $('qrModal').classList.replace('flex', 'hidden');
    };

    listen('whatsapp_connecting', () => {
      $('qrStatus').textContent = 'Bağlanıyor...';
    });

    listen('qr_code', (event) => {
      $('qrStatus').textContent = 'QR kodu telefonunuzdan okutun';
      $('qrcode').innerHTML = '';
      if (typeof QRCode === 'undefined') {
        $('qrcode').innerHTML = '<p class="text-xs text-red-500 max-w-[256px]">QR kütüphanesi yüklenemedi (qrcode.min.js).</p>';
        return;
      }
      new QRCode($('qrcode'), {
        text: event.payload,
        width: 256,
        height: 256,
      });
    });

    listen('whatsapp_ready', () => {
      $('qrModal').classList.replace('flex', 'hidden');
      applyStatus('connected');
    });

    listen('whatsapp_disconnected', (event) => {
      applyStatus('offline');
      $('sendStatus').classList.remove('hidden');
      $('sendStatus').textContent = event.payload || 'Bağlantı koptu.';
    });

    listen('whatsapp_error', (event) => {
      applyStatus('offline');
      $('qrModal').classList.replace('flex', 'hidden');
      alert("WhatsApp hatası: " + event.payload);
    });

    // Startup
    loadData().then(async () => {
      try {
        applyStatus(await invoke('get_wa_status'));
      } catch (e) { console.error(e); }
    });
  </script>
</body>
</html>
