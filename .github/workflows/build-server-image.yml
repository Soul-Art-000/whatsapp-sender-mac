name: Build Server Image

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'docker/**'
      - 'Dockerfile'
      - '.github/workflows/build-server-image.yml'
    tags:
      - 'app-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/soul-art-000/whatsapp-sender-mac:latest
            ghcr.io/soul-art-000/whatsapp-sender-mac:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (imaj gerçekten açılıyor mu)
        run: |
          docker run -d --name wa-smoke -p 18080:8080 ghcr.io/soul-art-000/whatsapp-sender-mac:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null; then echo "arayüz yanıt verdi"; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18080/ | grep -qi "WhatsApp" || { docker logs wa-smoke; exit 1; }
          TOKEN=$(docker exec wa-smoke cat /data/token)
          curl -fsS -X POST "http://127.0.0.1:18080/api/get_contacts?token=$TOKEN" -H 'Content-Type: application/json' -d '{}' || { docker logs wa-smoke; exit 1; }
          docker rm -f wa-smoke
