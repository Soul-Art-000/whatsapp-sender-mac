name: Deploy UI to GitHub Pages

# Arayüz statik tek dosyadır; sunucu backend'i (whatsapp-server) ayrı çalışır ve
# arayüz ona `?api=https://...` ile bağlanır. Böylece telefondan da erişilebilen
# bir arayüz olur, sunucuda web sunucusu kurmak gerekmez.

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
