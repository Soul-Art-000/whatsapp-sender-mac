name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # Not: varsayılan (masaüstü/Tauri) hedef Linux'ta derlenemez — Tauri v1
      # webkit2gtk-4.0 ister. Masaüstü derlemesi Windows/macOS iş akışlarında
      # yapılır; burada sunucu hedefi denetlenir.
      - run: cargo clippy --no-default-features --features server --all-targets -- -D warnings
      - run: cargo test --no-default-features --features server
