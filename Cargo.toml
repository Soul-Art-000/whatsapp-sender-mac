[package]
name = "whatsapp-sender"
version = "0.2.0"
edition = "2021"
build = "build.rs"

[lib]
name = "whatsapp_sender"
path = "src/lib.rs"

# Masaüstü uygulaması (Tauri + WebKitGTK). Varsayılan hedef.
[[bin]]
name = "whatsapp-sender"
path = "src/main.rs"
required-features = ["desktop"]

# Sunucu (headless): HTTP API + WebSocket, tarayıcı arayüzü.
# Derleme: cargo build --release --no-default-features --features server
[[bin]]
name = "whatsapp-server"
path = "src/bin/whatsapp-server.rs"
required-features = ["server"]

[dependencies]
csv = "1.4.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
wa-rs = "0.2.0"
wa-rs-sqlite-storage = "0.2.0"
wa-rs-tokio-transport = "0.2.0"
wa-rs-ureq-http = "0.2.0"
tauri = { version = "1.5", features = ["api-all"], optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
# whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust.git" }

[build-dependencies]
tauri-build = { version = "1.5", optional = true }

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "custom-protocol"]
server = ["dep:axum"]
custom-protocol = ["tauri/custom-protocol"]
