[package]
name = "whatsapp-sender"
version = "0.5.5"
edition = "2021"
build = "build.rs"

[workspace]
members = ["server"]

[lib]
name = "whatsapp_sender"
path = "src/lib.rs"

[dependencies]
csv = "1.4.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
wa-rs = "0.2.0"
wa-rs-sqlite-storage = "0.2.0"
wa-rs-tokio-transport = "0.2.0"
wa-rs-ureq-http = "0.2.0"
tauri = { version = "1.5", features = ["api-all", "system-tray"], optional = true }

[build-dependencies]
tauri-build = { version = "1.5", optional = true }

[features]
default = ["desktop"]
# Masaüstü (Tauri) hedefi tauri'yi çeker; `--no-default-features` ile kapatılır
# (sunucu paketi lib'i bu şekilde tauri'siz kullanır).
desktop = ["dep:tauri", "dep:tauri-build", "custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
